---
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Required to push the release commit and tag.
      id-token: write # Required to create a SLSA attestation for the release.
      attestations: write # Required to create a SLSA attestation for the release.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history needed to find the previous release tag

      - id: intent
        name: Intent Release
        uses: goeselt/intent@4ddbdcaca80e9eec590a81badeb0bc747fd65cbf # v1.3.0
        with:
          initial-version: '1.0.0'

      - name: Set Up Go
        if: steps.intent.outputs.release-needed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build Release Assets
        if: steps.intent.outputs.release-needed == 'true'
        env:
          VERSION: ${{ steps.intent.outputs.next-version }}
        run: make release-assets

      - name: Release
        if: steps.intent.outputs.release-needed == 'true'
        uses: goeselt/dispatch@72482f5dee11ae6ad32d44b9d926c6d1708dea98 # v1.3.6
        with:
          release-tag: ${{ steps.intent.outputs.release-tag }}
          assets: |
            dist/*.tar.gz
            dist/checksums.txt
          git-user-name: ${{ secrets.RELEASE_SIGNING_USER }}
          git-user-email: ${{ secrets.RELEASE_SIGNING_EMAIL }}
          signing-key: ${{ secrets.RELEASE_SIGNING_KEY }}

      - name: Attest Build Provenance
        if: steps.intent.outputs.release-needed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
